name: release

# Tag v*.*.* builds the wheel + sdist into dist/ with checksums and uploads
# them as workflow artifacts. The repo's release tooling attaches dist/* to
# the GitHub Release. The PyPI job is opt-in: it stays skipped until the repo
# variable PYPI_PUBLISH is set to "true" and a Trusted Publisher is
# registered, so a fresh repo's first release stays green.

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheel and sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Checksums
        run: cd dist && sha256sum * > checksums.txt && cat checksums.txt
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') && vars.PYPI_PUBLISH == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # PyPI trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
