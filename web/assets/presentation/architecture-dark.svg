<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540" data-palette="afe656-74e76a-f5f6ac-062843c69ff9" role="img" aria-labelledby="ub-ar-dark-title ub-ar-dark-desc"><title id="ub-ar-dark-title">unbury architecture</title><desc id="ub-ar-dark-desc">Session logs, the claude and codex parsers, extraction into the AnswerCard, then the terminal card and the linked HTML view.</desc>
<defs>
<linearGradient id="ub-ar-dark-brand" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#afe656"/><stop offset="0.55" stop-color="#74e76a"/><stop offset="1" stop-color="#f5f6ac"/></linearGradient>
<radialGradient id="ub-ar-dark-halo" cx="0.62" cy="0.36" r="0.85"><stop stop-color="#afe656" stop-opacity="0.2"/><stop offset="1" stop-color="#080c0d" stop-opacity="0"/></radialGradient>
<marker id="ub-ar-dark-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="m1 1 7 4-7 4" fill="none" stroke="#afe656" stroke-width="1.5"/></marker>
</defs>
<style>text{font-family:Arial,'Helvetica Neue','Noto Sans',sans-serif}.ub-ar-dark-mono{font-family:Menlo,Consolas,'Liberation Mono',monospace}.ub-ar-dark-flow{animation:ub-ar-dark-flow 5.5s linear infinite}@keyframes ub-ar-dark-flow{to{stroke-dashoffset:-160}}.ub-ar-dark-pulse{animation:ub-ar-dark-pulse 4.2s ease-in-out infinite}@keyframes ub-ar-dark-pulse{0%,100%{opacity:.4}50%{opacity:1}}@media (prefers-reduced-motion: reduce){*{animation:none !important;transform:none !important}}</style>
<rect width="1000" height="540" rx="14" fill="#080c0d"/>
<rect width="1000" height="540" rx="14" fill="url(#ub-ar-dark-halo)"/>
<pattern id="ub-ar-dark-grid" width="44" height="44" patternUnits="userSpaceOnUse"><path d="M44 0H0V44" fill="none" stroke="#2d3c1d" stroke-opacity="0.32" stroke-width="0.6"/></pattern><rect width="1000" height="540" rx="14" fill="url(#ub-ar-dark-grid)"/><text x="36" y="42" fill="#a7b9a8" font-size="12" letter-spacing="2">ARCHITECTURE</text>
<text x="36" y="72" fill="#fdfdee" font-size="19" font-weight="700">One CLI, four stages, one typed conclusion</text>
<rect x="36" y="100" width="440" height="120" rx="10" fill="#101713" stroke="#2d3c1d" stroke-dasharray="4 4"/>
<text x="52" y="122" fill="#a7b9a8" font-size="11.5" class="ub-ar-dark-mono">session logs — agent-written, read-only</text>
<text x="52" y="146" fill="#a7b9a8" font-size="11.5" class="ub-ar-dark-mono">~/.claude/projects/&lt;project&gt;/&lt;id&gt;.jsonl</text>
<text x="52" y="164" fill="#a7b9a8" font-size="10.5">finished = no live process owns it (pid)</text>
<text x="52" y="188" fill="#a7b9a8" font-size="11.5" class="ub-ar-dark-mono">~/.codex/sessions/**/rollout-*.jsonl</text>
<text x="52" y="206" fill="#a7b9a8" font-size="10.5">finished = file quiet ≥ 5 min · not a subagent</text>
<path d="M256 220 V288" fill="none" stroke="#afe656" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="3 7" marker-end="url(#ub-ar-dark-arrow)" class="ub-ar-dark-flow"/>
<rect x="36" y="296" width="440" height="104" rx="10" fill="#101717" stroke="#2d3c1d"/>
<text x="52" y="322" fill="#fdfdee" font-size="13.5" font-weight="600">parsers/ — dialect knowledge lives here</text>
<rect x="52" y="334" width="196" height="56" rx="10" fill="#101717" stroke="#2d3c1d" stroke-width="1"/><text x="68" y="360" fill="#fdfdee" font-size="12.5" font-weight="600">claude.py</text><text x="68" y="381" fill="#a7b9a8" font-size="11" class="ub-ar-dark-mono">titles · tool calls</text>
<rect x="264" y="334" width="196" height="56" rx="10" fill="#101717" stroke="#2d3c1d" stroke-width="1"/><text x="280" y="360" fill="#fdfdee" font-size="12.5" font-weight="600">codex.py</text><text x="280" y="381" fill="#a7b9a8" font-size="11" class="ub-ar-dark-mono">apply_patch decoded</text>
<path d="M256 400 V428" fill="none" stroke="#afe656" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="3 7" marker-end="url(#ub-ar-dark-arrow)" class="ub-ar-dark-flow"/>
<text x="272" y="424" fill="#a7b9a8" font-size="10.5" class="ub-ar-dark-mono">shared [Turn]</text>
<rect x="36" y="436" width="440" height="74" rx="10" fill="#101717" stroke="#2d3c1d" stroke-width="1"/><text x="52" y="462" fill="#fdfdee" font-size="14" font-weight="600">extract.py — heuristics, not a model</text><text x="52" y="483" fill="#a7b9a8" font-size="11" class="ub-ar-dark-mono">final substantive answer, verbatim</text><text x="52" y="502" fill="#a7b9a8" font-size="11" class="ub-ar-dark-mono">file · command · decision evidence</text>
<text x="36" y="534" fill="#a7b9a8" font-size="10.5" class="ub-ar-dark-mono">single process · no server · no daemon</text>
<rect x="540" y="100" width="424" height="190" rx="10" fill="#101717" stroke="#afe656" stroke-width="1.6"/><text x="556" y="126" fill="#afe656" font-size="13.5" font-weight="700">AnswerCard — the core primitive</text><text x="556" y="147" fill="#a7b9a8" font-size="11" class="ub-ar-dark-mono">SessionRef { agent, path, turns }</text><text x="556" y="166" fill="#a7b9a8" font-size="11" class="ub-ar-dark-mono">Evidence { kind: file | command | decision,</text><text x="556" y="185" fill="#a7b9a8" font-size="11" class="ub-ar-dark-mono">           summary, ref: (path, line) }</text><text x="556" y="204" fill="#a7b9a8" font-size="11" class="ub-ar-dark-mono">AnswerCard { session, conclusion,</text><text x="556" y="223" fill="#a7b9a8" font-size="11" class="ub-ar-dark-mono">             evidence }  · ordered, deduped</text>
<text x="556" y="276" fill="#afe656" font-size="11" class="ub-ar-dark-mono">conclusion quoted verbatim — no model call</text>
<path d="M476 473 C 520 473, 540 360, 556 296" fill="none" stroke="#afe656" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="3 7" marker-end="url(#ub-ar-dark-arrow)" class="ub-ar-dark-flow"/>
<path d="M640 290 V330" fill="none" stroke="#afe656" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="3 7" marker-end="url(#ub-ar-dark-arrow)" class="ub-ar-dark-flow"/>
<path d="M864 290 V330" fill="none" stroke="#afe656" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="3 7" marker-end="url(#ub-ar-dark-arrow)" class="ub-ar-dark-flow"/>
<rect x="540" y="338" width="200" height="84" rx="10" fill="#101717" stroke="#afe656" stroke-width="1.6"/><text x="556" y="364" fill="#afe656" font-size="14" font-weight="700">render.py</text><text x="556" y="385" fill="#a7b9a8" font-size="11" class="ub-ar-dark-mono">one-screen</text><text x="556" y="404" fill="#a7b9a8" font-size="11" class="ub-ar-dark-mono">terminal card</text>
<rect x="764" y="338" width="200" height="84" rx="10" fill="#101717" stroke="#afe656" stroke-width="1.6"/><text x="780" y="364" fill="#afe656" font-size="14" font-weight="700">htmlview.py</text><text x="780" y="385" fill="#a7b9a8" font-size="11" class="ub-ar-dark-mono">linked transcript</text><text x="780" y="404" fill="#a7b9a8" font-size="11" class="ub-ar-dark-mono">#L anchors</text>
<line x1="540" y1="452" x2="964" y2="452" stroke="#2d3c1d"/>
<text x="540" y="478" fill="#a7b9a8" font-size="11">parsers own the dialect — extraction and</text>
<text x="540" y="498" fill="#a7b9a8" font-size="11">both renderers stay agent-agnostic</text></svg>
